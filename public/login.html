<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - SB Tropical</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="loginScreen">
  <div class="login-box text-center">
    <div class="logo-wrapper mb-3 d-flex justify-content-center align-items-center">
      <img src="images/sb.png" alt="SB Tropical Logo" class="login-logo">
    </div>

    <form id="loginForm">
      <div class="form-floating mb-3 text-start">
        <input type="text" class="form-control" id="loginUsername" placeholder="Username" required autocomplete="username">
        <label for="loginUsername"><i class="bi bi-person me-1"></i> ชื่อผู้ใช้งาน (Username)</label>
      </div>
      <div class="form-floating mb-3 text-start">
        <input type="password" class="form-control" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <label for="loginPassword"><i class="bi bi-lock me-1"></i> รหัสผ่าน (Password)</label>
      </div>
      
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="background-color: var(--sb-primary, #0d6efd); border: none;">
        <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
      </button>
    </form>
  </div>
</div>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- 🟢 1. โหลด Firebase Web SDK (Compat version สำหรับบราวเซอร์) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- 🟢 2. โหลดสื่อกลางติดต่อ Firestore -->
  <script src="js/firestore.js"></script>

  <!-- 🟡 3. โหลดไฟล์จัดการหน้า Login -->
  <script src="js/login.js"></script>
</body>
</html>
