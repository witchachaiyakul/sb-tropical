<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกการขาย - SB Tropical</title>

  <!-- 1. Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- 2. Flatpickr & DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">

  <!-- 3. Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ==================== TOP NAVBAR ==================== -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: var(--sb-primary, #0d6efd);">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="main.html">
        <img src="images/sb.png" alt="SB Logo" height="36" class="me-2 bg-white rounded p-1">
        SB Tropical
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="main.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-house-door-fill me-1"></i> หน้าหลัก
        </a>
        <button class="btn btn-danger btn-sm shadow-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <!-- ==================== MAIN CONTENT (TABLE & ACTION) ==================== -->
  <div class="container-fluid px-4 py-4">
    
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2">
      <div class="btn-back cursor-pointer mb-0" onclick="window.location.href='main.html'">
        <i class="bi bi-arrow-left-circle-fill fs-5 me-1 text-primary"></i>
        <span class="fw-bold text-primary">ย้อนกลับหน้าเมนูหลัก</span>
      </div>

      <!-- ปุ่มเปิด POPUP บันทึกรายการใหม่ -->
      <button class="btn btn-success btn-lg fw-bold shadow-sm" onclick="openSaleModal()">
        <i class="bi bi-plus-circle-fill me-2"></i>บันทึกรายการใหม่
      </button>
    </div>

    <!-- ตารางรายการบันทึกการขาย -->
    <div class="sb-card p-4 border rounded shadow-sm bg-white">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-2 border-bottom gap-2">
        <h5 class="fw-bold mb-0 text-dark">
          <i class="bi bi-table text-primary me-2"></i>รายการบันทึกการขาย
        </h5>

        <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
          <div class="d-flex align-items-center gap-1 bg-light p-1 rounded border">
            <small class="fw-bold text-muted px-1"><i class="bi bi-calendar-range me-1"></i>ตั้งแต่:</small>
            <select class="form-select form-select-sm w-auto" id="filterStartMonth"></select>
            <select class="form-select form-select-sm w-auto" id="filterStartYear"></select>

            <small class="fw-bold text-muted px-1">ถึง:</small>
            <select class="form-select form-select-sm w-auto" id="filterEndMonth"></select>
            <select class="form-select form-select-sm w-auto" id="filterEndYear"></select>

            <button class="btn btn-sm btn-primary px-2 shadow-sm" onclick="loadSalesDataByMonthRange()">
              <i class="bi bi-search"></i> ค้นหา
            </button>
          </div>

          <select class="form-select form-select-sm w-auto" id="filterPaymentType" onchange="filterData()">
            <option value="ALL">ประเภททั้งหมด</option>
            <option value="เงินสด">เฉพาะ เงินสด</option>
            <option value="เงินเชื่อ">เฉพาะ เงินเชื่อ</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle" id="salesTable" style="width:100%">
          <thead>
            <tr>
              <th>NO</th>
              <th>วันที่</th>
              <th>ผู้ซื้อ</th>
              <th>บาท/หน่วย</th>
              <th>จำนวน</th>
              <th>จำนวนเงิน</th>
              <th>ชำระเงิน</th>
              <th>หมายเหตุ</th>
              <th class="text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="salesTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL 1: POPUP ฟอร์มบันทึกการขาย ==================== -->
  <div class="modal fade" id="saleModal" tabindex="-1" aria-labelledby="saleModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="salesForm">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold" id="saleModalLabel">
              <i class="bi bi-cart-plus-fill me-2"></i>บันทึกรายการขาย
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body p-4">
            <input type="hidden" id="editDocId" value="">

            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label small fw-bold">เลขที่เอกสาร (NO)</label>
                <input type="text" class="form-control bg-light" id="saleNo" readonly placeholder="กำลังสร้างเลข..." />
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label small fw-bold">วันที่รายการ <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input type="text" class="form-control bg-white" id="saleDate" placeholder="เลือกวันที่..." readonly />
                  <button class="btn btn-outline-secondary" type="button" id="btnCalendar">
                    <i class="bi bi-calendar3"></i>
                  </button>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label small fw-bold">ชื่อผู้ซื้อ / ลูกค้า <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input list="buyerList" class="form-control" id="buyerName" placeholder="ระบุชื่อหรือเลือกผู้ซื้อ" required autocomplete="off" />
                  <button class="btn btn-outline-primary" type="button" onclick="openAddBuyerModal()" title="เพิ่มผู้ซื้อใหม่">
                    <i class="bi bi-person-plus-fill"></i>
                  </button>
                </div>
                <datalist id="buyerList"></datalist>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold me-3 text-primary">ประเภทรายการ <span class="text-danger">*</span></label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="itemType" id="itemTypeFuel" value="น้ำมัน" checked onchange="toggleItemType()" />
                  <label class="form-check-label small fw-bold" for="itemTypeFuel"><i class="bi bi-fuel-pump me-1"></i>น้ำมัน</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="itemType" id="itemTypeOther" value="อื่นๆ" onchange="toggleItemType()" />
                  <label class="form-check-label small fw-bold" for="itemTypeOther"><i class="bi bi-box-seam me-1"></i>อื่นๆ</label>
                </div>
              </div>

              <div class="col-12 col-md-3" id="fuelNameCol">
                <label class="form-label small fw-bold">ชนิดน้ำมัน <span class="text-danger">*</span></label>
                <select class="form-select fw-bold" id="fuelItemName">
                  <option value="95" selected>95</option>
                  <option value="ดีเซล">ดีเซล</option>
                </select>
              </div>

              <div class="col-12 col-md-3" id="fuelPriceCol">
                <label class="form-label small fw-bold">ราคา / ลิตร (บาท) <span class="text-danger">*</span></label>
                <input type="number" step="any" min="0" class="form-control text-end fw-bold" id="pricePerLiter" placeholder="0.00" oninput="calculateTotal()" required />
              </div>

              <div class="col-12 col-md-3" id="fuelQtyCol">
                <label class="form-label small fw-bold">จำนวน (ลิตร) <span class="text-danger">*</span></label>
                <input type="number" step="any" min="0" class="form-control text-end fw-bold" id="liters" placeholder="0.00" oninput="calculateTotal()" required />
              </div>

              <div class="col-12 col-md-4" id="otherNameCol" style="display: none;">
                <label class="form-label small fw-bold">รายการ <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="otherItemName" placeholder="ระบุรายการ" />
              </div>

              <div class="col-6 col-md-2" id="otherQtyCol" style="display: none;">
                <label class="form-label small fw-bold">จำนวน <span class="text-danger">*</span></label>
                <input type="number" step="any" min="0" class="form-control text-end fw-bold" id="otherQty" placeholder="0" oninput="calculateTotal()" />
              </div>

              <div class="col-6 col-md-3" id="otherUnitPriceCol" style="display: none;">
                <label class="form-label small fw-bold">ราคา / หน่วย <span class="text-danger">*</span></label>
                <input type="number" step="any" min="0" class="form-control text-end fw-bold" id="otherUnitPrice" placeholder="0.00" oninput="calculateTotal()" />
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label small fw-bold text-primary">ปรับทศนิยม</label>
                <select class="form-select" id="decimalPrecision" onchange="calculateTotal()">
                  <option value="2" selected>2 ตำแหน่ง</option>
                  <option value="0">ไม่มีทศนิยม (ปัดขึ้น 1 บาท)</option>
                  <option value="floor">ไม่มีทศนิยม (ปัดลง 1 บาท)</option>
                </select>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label small fw-bold text-success">จำนวนเงินรวม</label>
                <div class="total-box-display d-flex justify-content-between align-items-center py-1 px-3 border rounded bg-light" style="height: 38px;">
                  <span class="fw-bold text-secondary small">รวม:</span>
                  <span class="fs-5 fw-bold text-success" id="totalAmountDisplay">0.00 บาท</span>
                </div>
                <input type="hidden" id="totalAmount" value="0" />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label small fw-bold d-block">ประเภทการชำระเงิน <span class="text-danger">*</span></label>
                <div class="btn-group w-100" role="group">
                  <input type="radio" class="btn-check" name="paymentType" id="payCash" value="เงินสด" checked />
                  <label class="btn btn-outline-success fw-bold py-2" for="payCash"><i class="bi bi-cash-coin me-1"></i> เงินสด</label>

                  <input type="radio" class="btn-check" name="paymentType" id="payCredit" value="เงินเชื่อ" />
                  <label class="btn btn-outline-warning fw-bold py-2" for="payCredit"><i class="bi bi-file-earmark-text me-1"></i> เงินเชื่อ</label>
                </div>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">หมายเหตุ</label>
                <input type="text" class="form-control" id="remarks" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)" />
              </div>
            </div>
          </div>

          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-outline-secondary me-auto" onclick="resetForm()">
              <i class="bi bi-arrow-clockwise me-1"></i>ล้างฟอร์ม
            </button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
            <button type="submit" class="btn btn-primary fw-bold px-4" id="btnSaveRecord">
              <i class="bi bi-save me-1"></i> บันทึกข้อมูลการขาย
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL 2: POPUP เพิ่มผู้ซื้อใหม่ ==================== -->
  <div class="modal fade" id="addBuyerModal" tabindex="-1" aria-labelledby="addBuyerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="addBuyerForm" onsubmit="handleSaveBuyer(event)">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="addBuyerModalLabel">
              <i class="bi bi-person-plus-fill me-2 text-primary"></i>เพิ่มผู้ซื้อใหม่
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-bold">ชื่อย่อ / ชื่อเรียกทั่วไป <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="modalBuyerName" required placeholder="เช่น นายเอ, บจก.สยาม" />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">ชื่อเต็ม / ชื่อจดทะเบียนบริษัท</label>
              <input type="text" class="form-control" id="modalBuyerFullname" placeholder="ระบุชื่อเต็ม (ถ้ามี)" />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">เลขประจำตัวผู้เสียภาษี</label>
              <input type="text" class="form-control" id="modalBuyerTaxId" placeholder="เลข 13 หลัก (ถ้ามี)" />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">ที่อยู่</label>
              <textarea class="form-control" id="modalBuyerAddress" rows="2" placeholder="รายละเอียดที่อยู่"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
            <button type="submit" class="btn btn-primary fw-bold">บันทึกข้อมูล</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 🟢 1. jQuery & Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- 🟢 2. Flatpickr & DataTables JS -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

  <!-- 🟢 3. Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- 🟢 4. App Scripts -->
  <script src="js/firestore.js"></script>
  <script src="js/login.js"></script>
  <script src="js/main.js"></script>
  <script src="js/sale-record.js"></script>
</body>
</html>
