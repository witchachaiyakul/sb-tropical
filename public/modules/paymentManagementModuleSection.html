<section id="paymentManagementModuleSection" class="module-section d-none">
  <!-- ปุ่มย้อนกลับ -->
  <div class="d-flex align-items-center mb-3">
    <button class="btn btn-outline-secondary btn-sm" onclick="showModule('mainMenuSection')">
      <i class="bi bi-arrow-left"></i> ย้อนกลับหน้าเมนูหลัก
    </button>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3">
      <h4 class="fw-bold text-dark mb-0"><i class="bi bi-cash-stack text-primary me-2"></i>บันทึกการชำระเงินและการโอนจ่าย</h4>
    </div>
    <div class="card-body">
      
      <!-- ตัวกรอง เดือน / พ.ศ. / ชื่อผู้ซื้อ-ผู้รับเงิน และ สถานะ -->
      <div class="row g-3 mb-4 bg-light p-3 rounded align-items-end">
        <div class="col-6 col-md-2">
          <label class="form-label fw-bold mb-1"><i class="bi bi-calendar-month me-1"></i>เลือกเดือน</label>
          <select id="pmtFilterMonth" class="form-select" onchange="loadPaymentManagementData()">
            <option value="01">มกราคม</option>
            <option value="02">กุมภาพันธ์</option>
            <option value="03">มีนาคม</option>
            <option value="04">เมษายน</option>
            <option value="05">พฤษภาคม</option>
            <option value="06">มิถุนายน</option>
            <option value="07">กรกฎาคม</option>
            <option value="08">สิงหาคม</option>
            <option value="09">กันยายน</option>
            <option value="10">ตุลาคม</option>
            <option value="11">พฤศจิกายน</option>
            <option value="12">ธันวาคม</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label fw-bold mb-1"><i class="bi bi-calendar-event me-1"></i>เลือก พ.ศ.</label>
          <select id="pmtFilterYear" class="form-select" onchange="loadPaymentManagementData()">
            <option value="2569">2569</option>
            <option value="2568">2570</option>
            <option value="2567">2571</option>
          </select>
        </div>
        <!-- 🟢 Dropdown แชร์ร่วมกันสำหรับกรอง ผู้ซื้อ หรือ ร้านค้า/ผู้รับเงิน -->
        <div class="col-12 col-md-3">
          <label id="lblPmtFilterName" class="form-label fw-bold mb-1"><i class="bi bi-person me-1"></i>กรองผู้ซื้อ</label>
          <select id="pmtFilterName" class="form-select" onchange="filterPaymentTable()">
            <option value="ALL">-- แสดงทั้งหมด --</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label fw-bold mb-1"><i class="bi bi-funnel me-1"></i>กรองสถานะ</label>
          <select id="pmtFilterStatus" class="form-select" onchange="filterPaymentTable()">
            <option value="UNPAID" selected>ยังไม่ชำระ / ยังไม่โอน</option>
            <option value="PAID">ชำระแล้ว / โอนแล้ว</option>
            <option value="ALL">-- แสดงทั้งหมด --</option>
          </select>
        </div>
        <div class="col-12 col-md-2 text-end">
          <button class="btn btn-primary w-100" onclick="loadPaymentManagementData()">
            <i class="bi bi-search me-1"></i> ค้นหา
          </button>
        </div>
      </div>

      <!-- ปุ่มใหญ่ 2 ปุ่มสลับ Tab -->
      <div class="row g-2 mb-4">
        <div class="col-12 col-md-6">
          <button id="btnTabCreditSales" class="btn btn-lg btn-success w-100 py-3 fw-bold shadow-sm active" onclick="switchPaymentTab('credit')">
            <i class="bi bi-person-check-fill me-2 fs-4"></i><br>1. อัปเดตการจ่ายเงินลูกค้าเงินเชื่อ
          </button>
        </div>
        <div class="col-12 col-md-6">
          <button id="btnTabCompanyExpenses" class="btn btn-lg btn-outline-primary w-100 py-3 fw-bold shadow-sm" onclick="switchPaymentTab('expense')">
            <i class="bi bi-bank2 me-2 fs-4"></i><br>2. อัปเดตการโอนจ่ายค่าใช้จ่ายบริษัท
          </button>
        </div>
      </div>

      <!-- 🟢 ตารางที่ 1: การจ่ายเงินลูกค้าเงินเชื่อ -->
      <div id="creditSalesSubView">
        <!-- ส่วนหัวข้อ + กล่องแสดงยอดรวมทางขวาสุด -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h5 class="fw-bold text-success mb-0">
            <i class="bi bi-journal-text me-2"></i>รายการลูกหนี้เงินเชื่อ
          </h5>
          <div class="bg-light border border-success-subtle px-3 py-1-5 rounded shadow-sm">
            <span class="fw-bold text-secondary me-2"><i class="bi bi-calculator me-1"></i>ยอดรวมที่แสดงผล:</span>
            <span id="creditSalesTotalAmount" class="fw-bold text-primary fs-5">0.00</span>
            <span class="fw-bold text-secondary ms-1">บาท</span>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle">
            <thead class="table-success text-center">
              <tr>
                <th>NO</th>
                <th>วันที่</th>
                <th>ผู้ซื้อ</th>
                <th>บาท/หน่วย</th>
                <th>จำนวน</th>
                <th>จำนวนเงิน</th>
                <th>หมายเหตุ</th>
                <th>สถานะ</th>
              </tr>
            </thead>
            <tbody id="creditSalesTableBody">
              <tr><td colspan="8" class="text-center py-4 text-muted">กำลังดึงข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 🟢 ตารางที่ 2: การโอนจ่ายค่าใช้จ่ายบริษัท -->
      <div id="companyExpenseSubView" class="d-none">
        <h5 class="fw-bold text-primary mb-3"><i class="bi bi-receipt me-2"></i>รายการค่าใช้จ่ายบริษัท</h5>
        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle">
            <thead class="table-primary text-center">
              <tr>
                <th>เลขที่บิล</th>
                <th>วันที่</th>
                <th>หมวดหมู่</th>
                <th>ร้านค้า/ผู้รับเงิน</th>
                <th>จำนวนเงิน (บาท)</th>
                <th>ช่องทางชำระ</th>
                <th>สถานะ</th>
              </tr>
            </thead>
            <tbody id="companyExpenseTableBody">
              <tr><td colspan="7" class="text-center py-4 text-muted">กำลังดึงข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- 🟢 โมดูลที่ 7: ออกใบเสร็จรับเงิน ใบกำกับภาษี -->
