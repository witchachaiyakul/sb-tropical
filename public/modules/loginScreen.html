  <div id="loginScreen">
    <div class="login-box text-center">
      <div class="mb-3">
        <img src="https://lh3.googleusercontent.com/d/1yg3sTFxmldNLBI-zXEmFh4ISJOnMxEEh" alt="SB Tropical Logo" class="login-logo mb-2">
      </div>

      <form id="loginForm">
        <div class="form-floating mb-3 text-start">
          <input type="text" class="form-control" id="loginUsername" placeholder="Username" required>
          <label for="loginUsername"><i class="bi bi-person me-1"></i> ชื่อผู้ใช้งาน (Username)</label>
        </div>
        <div class="form-floating mb-3 text-start">
          <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
          <label for="loginPassword"><i class="bi bi-lock me-1"></i> รหัสผ่าน (Password)</label>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="background-color: var(--sb-primary); border: none;">
          <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>
