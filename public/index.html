<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB Tropical</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="/main.css">
</head>
<body>
  <div id="appLoadError" class="alert alert-danger m-3" role="alert" hidden></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-sb sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center text-white" href="#" onclick="showModule('mainMenuSection')">
        <img src="https://lh3.googleusercontent.com/d/1yg3sTFxmldNLBI-zXEmFh4ISJOnMxEEh" alt="SB Tropical Logo" class="app-brand-logo me-2">
        <span>SB Tropical</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-light btn-sm fw-bold d-none" id="navBtnHome" onclick="showModule('mainMenuSection')">
          <i class="bi bi-grid-fill me-1"></i> เมนูหลัก
        </button>
        <div class="text-white text-end d-none d-sm-block">
          <div class="fw-bold small" id="userDisplayName">ผู้ใช้งาน</div>
          <small class="text-white-50" style="font-size: 0.75rem;" id="userRoleBadge">พนักงาน</small>
        </div>
        <button class="btn btn-light btn-sm fw-bold text-danger" onclick="logout()">
          <i class="bi bi-power me-1"></i> ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
  <script src="/js/app-loader.js" defer></script>
</body>
</html>
