<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกค่าใช้จ่าย - SB Tropical</title>

  <!-- 1. Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 2. DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">

  <!-- 3. Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ==================== TOP NAVBAR ==================== -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: var(--sb-primary, #0d6efd);">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="main.html">
        <img src="images/sb.png" alt="SB Logo" height="36" class="me-2 bg-white rounded p-1" onerror="this.src='https://lh3.googleusercontent.com/d/1Z2F5s7RXUAmSgA7bKKTqDKsHxdHGg3Cq'">
        SB Tropical
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="main.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-house-door-fill me-1"></i> หน้าหลัก
        </a>
        <button class="btn btn-danger btn-sm shadow-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <!-- ==================== MAIN CONTENT: รายการบันทึกค่าใช้จ่าย ==================== -->
  <div class="container-fluid px-4 py-4" id="expenseModuleSection">
    
    <div class="mb-3 d-flex justify-content-between align-items-center">
      <a href="main.html" class="btn btn-link text-decoration-none p-0 text-secondary fw-bold">
        <i class="bi bi-arrow-left-circle-fill fs-5 me-1 align-middle"></i>
        <span>ย้อนกลับหน้าเมนูหลัก</span>
      </a>

      <!-- ปุ่มเปิด Modal บันทึกค่าใช้จ่ายใหม่ -->
      <button type="button" class="btn btn-danger btn-lg fw-bold shadow-sm px-4" onclick="openAddExpenseModal()">
        <i class="bi bi-plus-circle-fill me-2"></i>บันทึกรายการค่าใช้จ่าย
      </button>
    </div>

    <!-- ตารางแสดงรายการค่าใช้จ่าย (แบบเต็มหน้าจอ) -->
    <div class="row g-4">
      <div class="col-12">
        <div class="card border-0 shadow-sm p-4 rounded-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-2 border-bottom gap-2">
            <h5 class="fw-bold mb-0 text-dark">
              <i class="bi bi-table text-secondary me-2"></i>รายการบันทึกค่าใช้จ่าย
            </h5>

            <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
              <div class="d-flex align-items-center gap-1 bg-light p-1 rounded border">
                <small class="fw-bold text-muted px-1"><i class="bi bi-calendar-range me-1"></i>ตั้งแต่:</small>
                <select class="form-select form-select-sm w-auto" id="filterExpStartMonth"></select>
                <select class="form-select form-select-sm w-auto" id="filterExpStartYear"></select>

                <small class="fw-bold text-muted px-1">ถึง:</small>
                <select class="form-select form-select-sm w-auto" id="filterExpEndMonth"></select>
                <select class="form-select form-select-sm w-auto" id="filterExpEndYear"></select>

                <button class="btn btn-sm btn-primary px-2 shadow-sm" onclick="loadExpenseData()">
                  <i class="bi bi-search"></i> ค้นหา
                </button>
              </div>

              <select class="form-select form-select-sm w-auto" id="filterRequisitionStatus" onchange="filterExpenseData()">
                <option value="ALL">สถานะตั้งเบิกทั้งหมด</option>
                <option value="REQ_YES">ตั้งเบิกแล้ว</option>
                <option value="REQ_NO">ยังไม่ตั้งเบิก</option>
              </select>

              <select class="form-select form-select-sm w-auto" id="filterTransferStatus" onchange="filterExpenseData()">
                <option value="ALL">สถานะการจ่ายเงินทั้งหมด</option>
                <option value="PAY_YES">โอนจ่ายแล้ว</option>
                <option value="PAY_NO">ยังไม่โอนจ่าย</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle" id="expenseTable" style="width:100%">
              <thead class="table-light">
                <tr>
                  <th>เลขที่บิล</th>
                  <th>วันที่</th>
                  <th>หมวดหมู่</th>
                  <th>ร้านค้า/ผู้รับเงิน</th>
                  <th class="text-end">จำนวนเงิน (บาท)</th>
                  <th class="text-center">ช่องทางชำระ</th>
                  <th class="text-center">สถานะ</th>
                  <th>หมายเหตุ</th>
                  <th class="text-center">จัดการ</th>
                </tr>
              </thead>
              <tbody id="expenseTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL: บันทึก/แก้ไขรายการค่าใช้จ่าย ==================== -->
  <div class="modal fade" id="expenseFormModal" tabindex="-1" data-bs-backdrop="static" aria-labelledby="expenseFormModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold" id="expenseFormModalLabel">
            <i class="bi bi-plus-circle-fill me-2"></i>บันทึกรายการค่าใช้จ่าย
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body p-4 bg-light">
          <form id="expenseForm">
            <input type="hidden" id="editExpenseDocId" value="">

            <div class="card border-0 p-3 bg-white shadow-sm rounded-3">
              <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                <span class="fw-bold text-secondary"><i class="bi bi-info-circle me-1"></i>กรอกรายละเอียดค่าใช้จ่าย</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetExpenseForm()">
                  <i class="bi bi-arrow-clockwise me-1"></i>ล้างฟอร์ม
                </button>
              </div>

              <div class="row g-3">
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-bold">เลขที่เอกสาร / บิล</label>
                  <input type="text" class="form-control bg-light" id="expenseNo" readonly placeholder="SBEXP1069-0001">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-bold">วันที่ทำรายการ</label>
                  <input type="date" class="form-control" id="expenseDate" required>
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-bold">รายการ <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <select class="form-select" id="expenseCategory" onchange="toggleExpenseCategory()" required>
                      <option value="">-- เลือกรายการ --</option>
                    </select>
                    <button class="btn btn-outline-danger fw-bold" type="button" onclick="openAddPayRecordModal()">
                      <i class="bi bi-plus-circle-fill me-1"></i> เพิ่ม
                    </button>
                  </div>
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-bold">ร้านค้า / ผู้รับเงิน <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="payeeName" placeholder="ระบุชื่อร้านค้า หรือ ผู้รับเงิน" required>
                </div>

                <!-- รายละเอียดการซื้อน้ำมัน (แสดงเฉพาะหมวดซื้อน้ำมัน) -->
                <div class="col-12" id="expFuelSection" style="display: none;">
                  <div class="p-3 bg-light rounded border border-danger border-opacity-25">
                    <h6 class="fw-bold text-danger mb-2"><i class="bi bi-fuel-pump-fill me-1"></i>รายละเอียดการซื้อน้ำมัน</h6>
                    <div class="row g-3">
                      <div class="col-12 col-md-4">
                        <label class="form-label small fw-bold">ชนิดน้ำมัน <span class="text-danger">*</span></label>
                        <div class="d-flex gap-3 pt-1">
                          <div class="form-check">
                            <input class="form-check-input" type="radio" name="expFuelItemName" id="expFuel95" value="95" checked>
                            <label class="form-check-label fw-bold" for="expFuel95">95</label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="radio" name="expFuelItemName" id="expFuelDiesel" value="ดีเซล">
                            <label class="form-check-label fw-bold" for="expFuelDiesel">ดีเซล</label>
                          </div>
                        </div>
                      </div>
                      <div class="col-12 col-md-4">
                        <label class="form-label small fw-bold">ราคา / ลิตร (บาท) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control text-end fw-bold" id="expPricePerLiter" placeholder="0.00" oninput="calculateExpenseTotal()">
                      </div>
                      <div class="col-12 col-md-4">
                        <label class="form-label small fw-bold">จำนวน (ลิตร) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control text-end fw-bold" id="expLiters" placeholder="0" oninput="calculateExpenseTotal()">
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-md-5">
                  <div class="mb-3">
                    <label class="form-label small fw-bold">จำนวนเงิน (บาท) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control text-end fw-bold text-danger fs-5" id="expenseAmount" placeholder="0.00" oninput="calculateExpenseTotal()" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-bold">การคิด Vat 7%</label>
                    <select class="form-select" id="expVatType" onchange="calculateExpenseTotal()">
                      <option value="NONE" selected>ไม่มี Vat (0%)</option>
                      <option value="INCLUSIVE">รวม Vat 7% (In-Vat)</option>
                      <option value="EXCLUSIVE">แยก Vat 7% (Ex-Vat)</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 col-md-6 ms-auto">
                  <div class="p-3 bg-light rounded border border-secondary border-opacity-25 shadow-sm">
                    <div class="d-flex flex-column gap-2">
                      <div>
                        <label class="form-label small fw-bold text-secondary mb-1">ก่อน Vat 7%</label>
                        <input type="text" class="form-control text-end bg-white" id="expAmountBeforeVat" placeholder="0.00" readonly>
                      </div>

                      <div>
                        <label class="form-label small fw-bold text-secondary mb-1">Vat 7%</label>
                        <input type="text" class="form-control text-end bg-white" id="expVatAmount" placeholder="0.00" readonly>
                      </div>

                      <div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                          <label class="form-label small fw-bold mb-0">จำนวนเงิน (บาท)</label>
                          <span class="badge bg-secondary opacity-75" style="font-size: 0.7rem;">ยอดตั้งต้น</span>
                        </div>
                        <input type="text" class="form-control text-end bg-white fw-bold text-danger fs-5" id="expAmountDisplay" placeholder="0.00" readonly>
                      </div>

                      <div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                          <label class="form-label small fw-bold text-success mb-0">รวมสุทธิ (totalWithVat)</label>
                          <span class="badge bg-success bg-opacity-25 text-success" style="font-size: 0.7rem;">ยอดจ่ายจริง</span>
                        </div>
                        <input type="text" class="form-control text-end bg-white fw-bold text-success fs-5 border-success" id="expTotalWithVat" placeholder="0.00" readonly>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12 mt-3 pt-3 border-top">
                  <div class="row g-3 align-items-center">
                    <div class="col-12 col-md-3">
                      <label class="form-label small fw-bold d-block">ช่องทางการชำระเงิน <small class="text-muted fw-normal">(ระบุเมื่อชำระแล้ว)</small></label>
                      <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="expensePayType" id="expPayCash" value="เงินสด" autocomplete="off" onclick="handlePayTypeClick(this)">
                        <label class="btn btn-outline-success fw-bold py-2" for="expPayCash"><i class="bi bi-cash-coin me-1"></i> เงินสด</label>

                        <input type="radio" class="btn-check" name="expensePayType" id="expPayTransfer" value="เงินโอน" autocomplete="off" onclick="handlePayTypeClick(this)">
                        <label class="btn btn-outline-primary fw-bold py-2" for="expPayTransfer"><i class="bi bi-bank me-1"></i> เงินโอน</label>
                      </div>
                    </div>

                    <div class="col-12 col-md-3" id="transferAccountCol" style="display: none;">
                      <label class="form-label small fw-bold">โอนจากบัญชี / ช่องทางโอน <span class="text-danger">*</span></label>
                      <select class="form-select fw-bold text-primary" id="expTransferAccount">
                        <option value="">-- เลือกบัญชีโอน --</option>
                      </select>
                    </div>

                    <div class="col-12 col-md-3" id="transferDateCol" style="display: none;">
                      <label class="form-label small fw-bold" id="expTransferDateLabel">วันที่ชำระเงิน <span class="text-danger">*</span></label>
                      <input type="date" class="form-control fw-bold" id="expTransferDate">
                    </div>

                    <div class="col-12 col-md-6" id="remarksCol">
                      <label class="form-label small fw-bold">หมายเหตุ / รายละเอียด</label>
                      <input type="text" class="form-control" id="expenseRemarks" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>

        <div class="modal-footer bg-white">
          <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">
            <i class="bi bi-x-circle me-1"></i> ปิดหน้าต่าง
          </button>
          <button type="button" class="btn btn-outline-secondary fw-bold" id="btnNewExpenseRecord" onclick="resetExpenseForm()">
            <i class="bi bi-arrow-clockwise me-1"></i> ล้างฟอร์ม
          </button>
          <button type="submit" form="expenseForm" class="btn btn-danger fw-bold px-4 shadow-sm" id="btnSaveExpense">
            <i class="bi bi-save me-1"></i> บันทึกข้อมูลค่าใช้จ่าย
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal เพิ่มรายการหมวดค่าใช้จ่ายใหม่ -->
  <div class="modal fade" id="addPayRecordModal" tabindex="-1" aria-labelledby="addPayRecordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold" id="addPayRecordModalLabel">
            <i class="bi bi-plus-circle-fill me-2"></i>เพิ่มรายการใหม่
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addPayRecordForm" onsubmit="handleSavePayRecord(event)">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label small fw-bold">ชื่อรายการ / หมวดค่าใช้จ่าย <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="modalPayItemName" placeholder="เช่น ค่าแรงช่าง, ค่าซ่อมบำรุง, ค่าอะไหล่" required>
            </div>
          </div>
          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
            <button type="submit" class="btn btn-danger fw-bold">
              <i class="bi bi-save me-1"></i> บันทึกรายการ
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- App Core Scripts -->
  <script src="js/firestore.js"></script>
  <script src="js/login.js"></script>
  <script src="js/expense.js"></script>
</body>
</html>
