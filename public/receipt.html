<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ออกใบเสร็จรับเงิน / ใบกำกับภาษี - SB Tropical</title>

  <!-- CSS Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-light">

  <!-- TOP NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: var(--sb-primary, #0d6efd);">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="main.html">
        <img src="images/sb.png" alt="SB Logo" height="36" class="me-2 bg-white rounded p-1" onerror="this.src='https://lh3.googleusercontent.com/d/1Z2F5s7RXUAmSgA7bKKTqDKsHxdHGg3Cq'">
        SB Tropical
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="main.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-house-door-fill me-1"></i> หน้าหลัก
        </a>
        <button class="btn btn-danger btn-sm shadow-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <!-- ปุ่มย้อนกลับ -->
    <div class="mb-3">
      <a href="main.html" class="btn btn-link text-decoration-none p-0 text-secondary fw-bold">
        <i class="bi bi-arrow-left-circle-fill fs-5 me-1 align-middle"></i>
        <span>ย้อนกลับหน้าเมนูหลัก</span>
      </a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h4 class="fw-bold text-dark mb-0">
          <i class="bi bi-wallet2 text-primary me-2"></i>ออกใบเสร็จรับเงิน / ใบกำกับภาษี
        </h4>
        <button class="btn btn-success fw-bold shadow-sm" onclick="generateBatchReceipts()">
          <i class="bi bi-file-earmark-pdf-fill me-1"></i> ออกใบเสร็จรับเงิน (รายการที่เลือก)
        </button>
      </div>
      <div class="card-body p-4">
        
        <!-- ตัวกรอง: เลือกเดือน / เลือก พ.ศ. / กรองผู้ซื้อ -->
        <div class="row g-3 mb-4 bg-light p-3 rounded align-items-end border">
          <div class="col-6 col-md-3">
            <label class="form-label fw-bold mb-1"><i class="bi bi-calendar-month me-1"></i>เลือกเดือน</label>
            <select id="rcpFilterMonth" class="form-select" onchange="loadUnreceiptedData()">
              <option value="01">มกราคม</option>
              <option value="02">กุมภาพันธ์</option>
              <option value="03">มีนาคม</option>
              <option value="04">เมษายน</option>
              <option value="05">พฤษภาคม</option>
              <option value="06">มิถุนายน</option>
              <option value="07">กรกฎาคม</option>
              <option value="08">สิงหาคม</option>
              <option value="09">กันยายน</option>
              <option value="10">ตุลาคม</option>
              <option value="11">พฤศจิกายน</option>
              <option value="12">ธันวาคม</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label fw-bold mb-1"><i class="bi bi-calendar-event me-1"></i>เลือก พ.ศ.</label>
            <select id="rcpFilterYear" class="form-select" onchange="loadUnreceiptedData()"></select>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label fw-bold mb-1"><i class="bi bi-person me-1"></i>กรองผู้ซื้อ</label>
            <select id="rcpBuyerFilter" class="form-select" onchange="filterUnreceiptedTable()">
              <option value="ALL">-- แสดงทั้งหมด --</option>
            </select>
          </div>
          <div class="col-12 col-md-2 text-end">
            <button class="btn btn-primary w-100 fw-bold" onclick="loadUnreceiptedData()">
              <i class="bi bi-search me-1"></i> ค้นหา
            </button>
          </div>
        </div>

        <!-- ตารางรายการที่ยังไม่ออกใบเสร็จ -->
        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle">
            <thead class="table-primary text-center">
              <tr>
                <th width="40"><input type="checkbox" id="checkAllRcp" onchange="toggleSelectAllRcp(this)"></th>
                <th>เลขที่บิล</th>
                <th>วันที่</th>
                <th>ผู้ซื้อ/ลูกค้า</th>
                <th>ประเภทสินค้า</th>
                <th>รายการสินค้า</th>
                <th>จำนวน</th>
                <th>ราคา/หน่วย</th>
                <th>จำนวนเงินรวม</th>
              </tr>
            </thead>
            <tbody id="unreceiptedTableBody">
              <tr>
                <td colspan="9" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  กำลังดึงข้อมูลรายการค้างออกใบเสร็จ...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- App Core Scripts -->
  <script src="js/firestore.js"></script>
  <script src="js/login.js"></script>
  <script src="js/receipt.js"></script>
</body>
</html>
